<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dictpics</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <img id="logo" src="/logo.webp" alt="dictpics logo" style="max-height: 60px;">
        <form id="searchForm">
            <input type="text" id="searchInput" placeholder="Search...">
            <button type="submit" id="searchButton">🔍</button>
        </form>
    </header>
    <main>
        <div id="imageContainer">
            <img id="uploadedImage" src="" alt="" style="display: none; max-width: 100%; max-height: 100%;">
            <input type="file" id="imageUpload" style="display: none;">
            <div id="buttonContainer">
                <button id="uploadButton">Upload Image</button>
                <button id="hideButton" style="display: none;">Hide</button>
            </div>
            <p id="imagePlaceholderText" style="display: none;">Image for <span id="searchTermText"></span></p>
        </div>
        <div id="definitionContainer">
            <h2 id="termTitle">Title</h2>
            <div id="definition">Definition from urban dictionary goes here</div>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
